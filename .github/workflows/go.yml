name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download dependencies
        run: go mod download

      - name: Minify embedded admin assets
        run: |
          npx --yes terser@5 cmd/server/admin.js --compress --mangle --output cmd/server/admin.js
          npx --yes clean-css-cli@5 -o cmd/server/admin.css -- cmd/server/admin.css
          npx --yes clean-css-cli@5 -o cmd/server/admin-interactive.css -- cmd/server/admin-interactive.css
          npx --yes html-minifier-terser@7 \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            cmd/server/admin.html \
            --output cmd/server/admin.min.html
          mv cmd/server/admin.min.html cmd/server/admin.html

      - name: Install UPX (fast)
        run: |
          curl -L -o upx.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xf upx.tar.xz
          sudo mv upx-*/upx /usr/local/bin/
          upx --version

      - name: Create bin directory
        run: mkdir -p bin

      - name: Build server
        run: |
          CGO_ENABLED=0 \
          GOAMD64=v2 \
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o bin/server \
            ./cmd/server

      - name: Build server (linux arm64)
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=arm64 \
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o bin/server-linux-arm64 \
            ./cmd/server

      - name: Build mesh-node (linux amd64)
        run: |
          CGO_ENABLED=0 \
          GOAMD64=v2 \
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o bin/mesh-node \
            ./cmd/mesh-node

      - name: Build mesh-node (linux arm64)
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=arm64 \
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o bin/mesh-node-linux-arm64 \
            ./cmd/mesh-node

      - name: Compress binaries
        run: |
          for binary in bin/*; do
            upx --best --lzma "$binary" &
          done
          wait

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/*
          compression-level: 0
          retention-days: 30

  windows-client:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Download Wintun for embedding
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'wintun') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wintun\wintun\bin\amd64\wintun.dll') cmd\mesh-node\wintun.dll

      - name: Test Windows client
        run: go test ./cmd/mesh-node ./internal/protocol

      - name: Build Windows client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o bin/mesh-node.exe ./cmd/mesh-node

      - name: Install UPX
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" `
            -OutFile upx.zip

          Expand-Archive upx.zip -DestinationPath .
          Copy-Item .\upx-4.2.4-win64\upx.exe C:\Windows\upx.exe

      - name: Compress Windows binary
        shell: pwsh
        run: |
          upx --best --lzma bin\mesh-node.exe

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: bin/*
          compression-level: 0
          retention-days: 30

  release:
    name: Publish Nightly Release
    needs:
      - build
      - windows-client

    runs-on: ubuntu-latest

    permissions:
      contents: write
  
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release
  
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: release
  
      - name: Delete previous nightly release
        continue-on-error: true
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          generate_release_notes: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
